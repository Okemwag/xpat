name: backend-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: floodcat_test
          POSTGRES_USER: floodcat
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U floodcat -d floodcat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FLOODCAT_DATABASE_URL: postgresql+psycopg://floodcat:ci-local-only@127.0.0.1:5432/floodcat_test
      TEST_DATABASE_URL: postgresql+psycopg://floodcat:ci-local-only@127.0.0.1:5432/floodcat_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.0'
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra geo --extra ui --extra ai
      - run: uv run --locked --extra dev --extra geo --extra ui --extra ai alembic upgrade head
      - run: uv run --locked --extra dev --extra geo --extra ui --extra ai python -m pytest -q
