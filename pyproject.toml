[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nairobi-flood-cat"
version = "0.1.0"
description = "Modular, assumption-transparent Nairobi flood CAT backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "geoalchemy2>=0.15,<1",
  "psycopg[binary]>=3.2,<4",
]
[project.optional-dependencies]
geo = ["rasterio>=1.3,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ui = ["streamlit>=1.50,<2", "rasterio>=1.3,<2"]
ai = ["google-genai>=1.0,<3"]
[project.scripts]
flood-cat = "floodcat.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
